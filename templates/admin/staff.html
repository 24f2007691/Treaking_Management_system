<!DOCTYPE html>
<html>

<head>
    <title>Manage Staff</title>
    <style>
     body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }
    table {
        width: 900px;
        margin: 30px auto;
        border-collapse: collapse;
        background: rgb(231, 231, 208, 0.65);
    }

    th {
        padding: 12px;
        background: rgb(235, 220, 6);
        color: rgb(66, 76, 58);
    }

    td {
        padding: 12px;
        color: rgb(53, 53, 39);
        border: 1px solid rgb(150, 150, 120);
    }

    

     a {
        display: inline-block;
        padding: 10px 18px;
        margin: 5px;
        color: rgb(66, 76, 58);
        text-decoration: none;
        border-radius: 5px;
        background: rgb(227, 230, 10);
    }

     a:hover {
        background: rgba(216, 213, 148, 0.5);
    }
    button {
    padding: 8px 15px;
    margin: 3px;
    border: none;
    border-radius: 5px;
    color: rgb(66, 76, 58);
    background: rgb(227, 230, 10);
}

button:hover {
    background: rgba(216, 213, 148, 0.5);
}
    </style>
</head>


<body>

<h1>Manage Staff</h1>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for staff in staff_list %}

    <tr>

        <td>{{ staff.id }}</td>

        <td>{{ staff.name }}</td>

        <td>{{ staff.email }}</td>

        <td>{{ staff.mobile }}</td>

        <td>{{ staff.status }}</td>

        <td>

            {% if staff.status == "Pending" %}

            <form method="POST"
                  action="{{ url_for('admin_approve_staff', user_id=staff.id) }}">

                <button type="submit">Approve</button>

            </form>

            {% endif %}


            {% if staff.status != "Blacklisted" %}

            <form method="POST"
                  action="{{ url_for('admin_blacklist_staff', user_id=staff.id) }}">

                <button type="submit">Blacklist</button>

            </form>

            {% endif %}

        </td>

    </tr>

    {% endfor %}

</table>

<br>

<a href="{{ url_for('admin_dashboard') }}">Back</a>

</body>

</html>
