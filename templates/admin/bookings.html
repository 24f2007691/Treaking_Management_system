<!DOCTYPE html>
<html>

<head>
    <title>All Bookings</title>
</head>
<style>
     body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }
    table {
        width: 900px;
        margin: 30px auto;
        border-collapse: collapse;
        background: rgb(231, 231, 208, 0.65);
    }

    th {
        padding: 12px;
        background: rgb(235, 220, 6);
        color: rgb(66, 76, 58);
    }

    td {
        padding: 12px;
        color: rgb(53, 53, 39);
        border: 1px solid rgb(150, 150, 120);
    }

    

     a {
        display: inline-block;
        padding: 10px 18px;
        margin: 5px;
        color: rgb(66, 76, 58);
        text-decoration: none;
        border-radius: 5px;
        background: rgb(227, 230, 10);
    }

     a:hover {
        background: rgba(216, 213, 148, 0.5);
    }
    </style>
<body>

<h1>All Bookings</h1>

<table border="1">

    <tr>
        <th>Booking ID</th>
        <th>Trekker</th>
        <th>Trek</th>
        <th>Date</th>
        <th>Booking Status</th>
        <th>Payment Status</th>
    </tr>

    {% for booking in bookings %}

    <tr>
        <td>{{ booking.id }}</td>
        <td>{{ booking.user.name }}</td>
        <td>{{ booking.trek.trek_name }}</td>
        <td>{{ booking.booking_date }}</td>
        <td>{{ booking.booking_status }}</td>
        <td>{{ booking.payment_status }}</td>
    </tr>

    {% endfor %}

</table>

<br>

<a href="{{ url_for('admin_dashboard') }}">Back to Dashboard</a>

</body>

</html>
