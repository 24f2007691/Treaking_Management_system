<!DOCTYPE html>
<html>

<head>
    <title>Manage Treks</title>
        <style>
     body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }
    table {
        width: 900px;
        margin: 30px auto;
        border-collapse: collapse;
        background: rgb(231, 231, 208, 0.65);
    }

    th {
        padding: 12px;
        background: rgb(235, 220, 6);
        color: rgb(66, 76, 58);
    }

    td {
        padding: 12px;
        color: rgb(53, 53, 39);
        border: 1px solid rgb(150, 150, 120);
    }

    

     a {
        display: inline-block;
        padding: 10px 18px;
        margin: 5px;
        color: rgb(66, 76, 58);
        text-decoration: none;
        border-radius: 5px;
        background: rgb(227, 230, 10);
    }

     a:hover {
        background: rgba(216, 213, 148, 0.5);
    }
    button {
    padding: 8px 15px;
    margin: 3px;
    border: none;
    border-radius: 5px;
    color: rgb(66, 76, 58);
    background: rgb(227, 230, 10);
}

button:hover {
    background: rgba(216, 213, 148, 0.5);
}
    </style>
</head>

<body>

<h1>Manage Treks</h1>

<a href="{{ url_for('admin_add_trek') }}">Add Trek</a>

<br><br>

<table border="1">

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Location</th>
        <th>Difficulty</th>
        <th>Slots</th>
        <th>Staff</th>
        <th>Status</th>
        <th>Action</th>
    </tr>

    {% for trek in treks %}

    <tr>
        <td>{{ trek.id }}</td>
        <td>{{ trek.trek_name }}</td>
        <td>{{ trek.location }}</td>
        <td>{{ trek.difficulty }}</td>
        <td>{{ trek.available_slots }}</td>
        <td>{{ trek.staff.trek_staff_name }}</td>
        <td>{{ trek.status }}</td>

        <td>
            <a href="{{ url_for('admin_edit_trek', trek_id=trek.id) }}">Edit</a>

            <a href="{{ url_for('admin_assign_staff', trek_id=trek.id) }}">Assign Staff</a>

            <form method="POST"
                  action="{{ url_for('admin_delete_trek', trek_id=trek.id) }}">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>

    {% endfor %}

</table>

<br>

<a href="{{ url_for('admin_dashboard') }}">Back</a>

</body>

</html>
