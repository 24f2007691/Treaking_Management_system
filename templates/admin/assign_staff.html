<!DOCTYPE html>
<html>

<head>
    <title>Assign Staff</title>
</head>

<body>

<h1>Assign Staff</h1>

<p>Trek: {{ trek.trek_name }}</p>

<form method="POST">

    <label>Select Staff:</label>

    <select name="staff_id" required>

        {% for staff in staff_list %}

        <option value="{{ staff.id }}">
            {{ staff.trek_staff_name }}
        </option>

        {% endfor %}

    </select>

    <br><br>

    <button type="submit">Assign</button>

</form>

<br>

<a href="{{ url_for('admin_treks') }}">Back</a>

</body>

</html>
