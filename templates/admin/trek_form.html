<!DOCTYPE html>
<html>

<head>
    <title>Add Trek</title>
    <style>
          body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }
        h1 {
            color: rgb(247, 247, 174);
        }

        form {
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: rgb(231, 231, 208, 0.65);
            border-radius: 8px;
        }

        label {
            color: rgb(53, 53, 39);
        }

        input,
        select {
            padding: 8px;
            margin: 5px;
            border: 1px solid rgb(150, 150, 120);
            border-radius: 5px;
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: rgb(66, 76, 58);
            background: rgb(227, 230, 10);
        }

        button:hover {
            background: rgba(216, 213, 148, 0.5);
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            color: rgb(66, 76, 58);
            text-decoration: none;
            border-radius: 5px;
            background: rgb(227, 230, 10);
        }

        a:hover {
            background: rgba(216, 213, 148, 0.5);
        }
    </style>
</head>

<body>

    <h1>Add New Trek</h1>

    <form method="POST">

        <label>Trek Name:</label>
        <input type="text" name="trek_name" required>

        <br><br>

        <label>Location:</label>
        <input type="text" name="location" required>

        <br><br>

        <label>Difficulty:</label>
        <select name="difficulty">
            <option value="Easy">Easy</option>
            <option value="Moderate">Moderate</option>
            <option value="Hard">Hard</option>
        </select>

        <br><br>

        <label>Duration:</label>
        <input type="number" name="duration" required>

        <br><br>

        <label>Available Slots:</label>
        <input type="number" name="available_slots" required>

        <br><br>

        <label>Start Date:</label>
        <input type="date" name="start_date">

        <br><br>

        <label>End Date:</label>
        <input type="date" name="end_date">

        <br><br>



        <select name="assigned_staff_id">

            <option value="">None</option>

            {% for staff in staff_list %}
            <option value="{{ staff.id }}">
                {{ staff.trek_staff_name }}
            </option>
            {% endfor %}

        </select>

        <br><br>

        <button type="submit">Add Trek</button>

    </form>

    <br>

    <a href="{{ url_for('admin_treks') }}">Back</a>

</body>

</html>
