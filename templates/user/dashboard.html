<!DOCTYPE html>
<html>

<head>
    <title>Trekker Dashboard</title>
    <style>
        body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }

        h1 {
            color: rgb(247, 247, 174);
        }

        h3 {
            color: rgb(232, 240, 11);
        }

        p {
            font-size: 18px;
            color: rgb(61, 74, 41);
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            color: rgb(90, 103, 80);
            text-decoration: none;
            border-radius: 5px;
            background: rgb(227, 230, 10);
        }

        a:hover {
            background: rgba(216, 213, 148, 0.5);
        }
    </style>
</head>

<body>

    <h1>Trekker Dashboard</h1>

    <p>Welcome, {{ user.name }}</p>

    <hr>

    <h3>Dashboard</h3>

    <p>Open Treks: {{ open_treks }}</p>

    <p>My Bookings: {{ my_bookings }}</p>

    <hr>

    <a href="{{ url_for('user_treks') }}">Browse Treks</a>



    <a href="{{ url_for('user_bookings') }}">My Bookings</a>



    <a href="{{ url_for('user_profile') }}">My Profile</a>

<br>

    <a href="{{ url_for('logout') }}">Logout</a>

</body>

</html>
