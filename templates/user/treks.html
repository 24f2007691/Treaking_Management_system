<!DOCTYPE html>
<html>

<head>
    <title>Browse Treks</title>
    <style>
        body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }

        h1 {
            color: rgb(247, 247, 174);
        }

        table {
            width: 900px;
            margin: 30px auto;
            border-collapse: collapse;
            background: rgb(231, 231, 208, 0.65);
        }

        th {
            padding: 12px;
            background: rgb(235, 220, 6);
            color: rgb(66, 76, 58);
        }

        td {
            padding: 12px;
            color: rgb(53, 53, 39);
            border: 1px solid rgb(150, 150, 120);
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            color: rgb(66, 76, 58);
            text-decoration: none;
            border-radius: 5px;
            background: rgb(227, 230, 10);
        }

        a:hover {
            background: rgba(216, 213, 148, 0.5);
        }
    </style>
</head>

<body>

    <h1>Available Treks</h1>

    <hr>

    <table border="1" cellpadding="10">

        <tr>
            <th>Trek Name</th>
            <th>Location</th>
            <th>Difficulty</th>
            <th>Available Slots</th>
            <th>Action</th>
        </tr>

        {% for trek in treks %}

        <tr>
            <td>{{ trek.trek_name }}</td>
            <td>{{ trek.location }}</td>
            <td>{{ trek.difficulty }}</td>
            <td>{{ trek.available_slots }}</td>

            <td>
                <a href="{{ url_for('user_trek_detail', trek_id=trek.id) }}">
                    View Details
                </a>
            </td>
        </tr>

        {% else %}

        <tr>
            <td colspan="5">No treks available.</td>
        </tr>

        {% endfor %}

    </table>

    <br>

    <a href="{{ url_for('user_dashboard') }}">Back to Dashboard</a>

</body>

</html>
