<!DOCTYPE html>
<html>

<head>
    <title>My Profile</title>
    <style>
        body {
            text-align: center;
            color: rgb(244, 244, 201);
            background: url('https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
            margin-bottom: 30px;
        }

        h1 {
            color: rgb(247, 247, 174);
        }

        form {
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            background: rgb(231, 231, 208, 0.65);
            border-radius: 8px;
        }

        label {
            color: rgb(53, 53, 39);
        }

        input {
            padding: 8px;
            margin: 5px;
            border: 1px solid rgb(150, 150, 120);
            border-radius: 5px;
        }

        p {
            color: rgb(53, 53, 39);
        }

        button {
            padding: 10px 18px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: rgb(66, 76, 58);
            background: rgb(227, 230, 10);
        }

        button:hover {
            background: rgba(216, 213, 148, 0.5);
        }

        a {
            display: inline-block;
            padding: 10px 18px;
            margin: 5px;
            color: rgb(66, 76, 58);
            text-decoration: none;
            border-radius: 5px;
            background: rgb(227, 230, 10);
        }

        a:hover {
            background: rgba(216, 213, 148, 0.5);
        }
    </style>
</head>

<body>

    <h1>My Profile</h1>

    <hr>

    <form method="POST">

        <label>Full Name:</label>
        <br>
        <input type="text" name="name" value="{{ user.name }}" required>

        <br><br>

        <label>Age:</label>
        <br>
        <input type="number" name="age" value="{{ user.age }}" required>

        <br><br>

        <label>Email:</label>
        <br>
        <input type="email" name="email" value="{{ user.email }}" required>

        <br><br>

        <label>Mobile Number:</label>
        <br>
        <input type="text" name="mobile" value="{{ user.mobile }}" required>

        <br><br>

        <label>Address:</label>
        <br>
        <input type="text" name="address" value="{{ user.address }}" required>

        <br><br>

        <label>New Password:</label>
        <br>
        <input type="password" name="password">

        <p>Leave password blank if you do not want to change it.</p>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{{ url_for('user_dashboard') }}">Back to Dashboard</a>

</body>

</html>
