<!DOCTYPE html>
<html>

<head>
    <title>Staff Registration</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            color: white;
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
        }

        .register-box {
            background: rgba(38, 47, 49, 0.65);
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin: 7px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #2E7D32;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>Join Our Trek Team</h1>
    <p>Register as Trek Staff and become part of the adventure.</p>

    <div class="register-box">

        <h2>Staff Registration</h2>
        <p>Your account needs Admin approval before you can login.</p>

        <form method="POST">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="number" name="age" placeholder="Age" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="text" name="mobile" placeholder="Mobile Number" required>

            <input type="text" name="address" placeholder="Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="number" name="experience" placeholder="Years of Experience" required>

            <input type="text" name="emergency_contact" placeholder="Emergency Contact" required>

            <button type="submit">Register as Staff</button>

        </form>

    </div>

    <a href="{{ url_for('home') }}">Back to Login</a>

</body>

</html>
