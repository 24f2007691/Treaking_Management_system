<!DOCTYPE html>
<html>

<head>
    <title>Trekker Registration</title>

    <style>
        body {
            text-align: center;
            color: rgb(216, 239, 239);
            background: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1920&q=80') center/cover fixed;
        }

        .register-box {
            background: rgba(43, 53, 58, 0.65);
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 12px;
        }

        input {
            width: 100%;
            padding: 9px;
            margin: 7px 0;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border: none;
            border-radius: 5px;
            background: #3c8ea7;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: white;
            text-decoration:dotted;
        }
    </style>
</head>

<body>

    <h1>Start Your Adventure Today!</h1>
    <p>Join us and discover your next trekking experience.</p>

    <div class="register-box">

        <h2>Trekker Registration</h2>

        <form method="POST">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="number" name="age" placeholder="Age" required>

            <input type="email" name="email" placeholder="Email" required>

            <input type="password" name="password" placeholder="Password" required>

            <input type="text" name="mobile" placeholder="Mobile Number" required>

            <input type="text" name="address" placeholder="Address" required>

            <button type="submit">Register as Trekker</button>

        </form>

    </div>

    <a href="{{ url_for('home') }}"> Back to Login</a>

</body>

</html>
